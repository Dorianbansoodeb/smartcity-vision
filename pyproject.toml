[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartcity-vision"
version = "0.1.0"
description = "Traffic-camera video analytics with YOLOv8: detection, tracking, and traffic metrics."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dorian Bansoodeb" }]
dependencies = [
    "ultralytics>=8.3.0",
    # Ultralytics pip-installs this at runtime on the first tracking call if it
    # is missing; declaring it keeps installs reproducible and CI offline-safe.
    "lap>=0.5.12",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "prometheus-client>=0.20.0",
    "mlflow>=2.14.0",
    "onnxruntime>=1.18.0",
    "opencv-python>=4.10.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pydantic>=2.8.0",
    "PyYAML>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "pandas-stubs>=2.2",
]

[project.scripts]
smartcity-vision = "smartcity_vision.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
smartcity_vision = ["api/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"

[tool.mypy]
# 3.12 so current numpy stubs (PEP 695 `type` statements) parse. Runtime is 3.11+.
python_version = "3.12"
mypy_path = "src"
packages = ["smartcity_vision"]
pretty = true
show_error_codes = true
warn_unused_ignores = true
disallow_untyped_defs = true
exclude = ["tests", "scripts"]

[[tool.mypy.overrides]]
module = [
    "cv2",
    "ultralytics",
    "ultralytics.*",
    "torch",
    "torch.*",
    "prometheus_client",
    "mlflow",
    "mlflow.*",
    "onnxruntime",
    "lap",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PTH", "RET", "ARG", "D"]
ignore = [
    "D203",  # conflicts with D211
    "D213",  # conflicts with D212
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
# "helpers" is the shared test-double module in tests/.
known-first-party = ["smartcity_vision", "helpers"]

[tool.ruff.lint.per-file-ignores]
# Test helpers and stubs do not need the docstring discipline of library code.
"tests/*" = ["D100", "D101", "D102", "D103", "D105", "D107", "ARG"]
"scripts/*" = ["D100"]
