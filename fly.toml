app = "dorian-smartcity-vision"
primary_region = "yyz"

[build]
  dockerfile = "Dockerfile.demo"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "90s"
  method = "GET"
  path = "/health"

[[vm]]
  memory = "2048mb"
  cpu_kind = "shared"
  cpus = 2
